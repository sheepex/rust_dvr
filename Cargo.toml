[package]
name = "visor-dvr"
version = "0.1.0"
edition = "2021"
description = "Visualizador desktop de câmeras de DVRs e NVRs por RTSP"
default-run = "visor-dvr"

[dependencies]
eframe = "0.31"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
retina = "0.4.22"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
futures = "0.3"
rust_h264 = "0.6.1"
rust_h265 = "0.4.1"

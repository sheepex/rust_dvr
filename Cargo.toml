[package]
name = "visor-dvr"
version = "0.1.0"
edition = "2021"
description = "Visualizador desktop de câmeras de DVRs e NVRs por RTSP"
default-run = "visor-dvr"

[dependencies]
eframe = "0.31"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
jiff = { version = "0.2", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
retina = { version = "0.4.22", path = "vendor/retina" }
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
futures = "0.3"
rust_h264 = "0.6.1"
rust_h265 = "0.4.1"
aes = "0.8"
zeroize = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
digest_auth = "0.3"
roxmltree = "0.20"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
oxvif = "0.18"

name: Build and release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --bin rustdvr
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/rustdvr-linux-x86_64/packaging
          cp target/release/rustdvr README.md LICENSE dist/rustdvr-linux-x86_64/
          cp -r packaging/linux dist/rustdvr-linux-x86_64/packaging/
          tar -C dist -czf dist/rustdvr-linux-x86_64.tar.gz rustdvr-linux-x86_64
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/rustdvr-windows-x86_64 | Out-Null
          Copy-Item target/release/rustdvr.exe, README.md, LICENSE dist/rustdvr-windows-x86_64/
          Compress-Archive -Path dist/rustdvr-windows-x86_64 -DestinationPath dist/rustdvr-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustdvr-${{ matrix.os }}-x86_64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
